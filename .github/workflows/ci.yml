# =============================================================================
# Khatabook AI — CI Pipeline
# =============================================================================
# Runs on every PR and push to main/develop.
# Pipeline: lint → typecheck → build → test → coverage.
# =============================================================================

name: CI

on:
 pull_request:
 branches: [main, develop]
 push:
 branches: [main, develop]

jobs:
 # ── Lint ─────────────────────────────────────────────────────────────────
 lint:
 name: Lint
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Lint all workspaces
 run: npm run lint
 - name: Check formatting
 run: npm run format:check

 # ── TypeScript Typecheck ─────────────────────────────────────────────────
 typecheck:
 name: TypeScript Typecheck
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Typecheck all workspaces
 run: npm run typecheck

 # ── Build Check ───────────────────────────────────────────────────────────
 build:
 name: Build
 runs-on: ubuntu-latest
 needs: [lint, typecheck]
 timeout-minutes: 10
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Build all workspaces
 run: npm run build
 - name: Check for build artifacts
 run: |
 ls -la frontend/.next/ || echo "No .next directory (expected in CI)"
 test -f frontend/.next/BUILD_ID || echo "No BUILD_ID (Next.js build not yet configured)"

 # ── Unit Tests ────────────────────────────────────────────────────────────
 test-unit:
 name: Unit Tests
 runs-on: ubuntu-latest
 timeout-minutes: 10
 services:
 postgres:
 image: postgres:15-alpine
 env:
 POSTGRES_USER: postgres
 POSTGRES_PASSWORD: testpass
 POSTGRES_DB: khatabook_test
 options: >-
 --health-cmd pg_isready
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 5432:5432
 redis:
 image: redis:7-alpine
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports:
 - 6379:6379
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Run backend unit tests
 run: npm run test:unit -w backend
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 - name: Run coverage
 run: npm run test:coverage -w backend
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test

 # ── Security Audit ────────────────────────────────────────────────────────
 security-audit:
 name: Security Audit
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Run npm audit
 run: npm audit --workspaces
 continue-on-error: true

 # ── E2E Tests (frontend only) ────────────────────────────────────────────
 test-e2e:
 name: E2E Tests
 runs-on: ubuntu-latest
 needs: [build]
 timeout-minutes: 15
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Install Playwright browsers
 run: npx playwright install --with-deps chromium
 - name: Build frontend
 run: npm run build -w frontend
 - name: Run Playwright tests
 run: npm run test:e2e -w frontend
 env:
 NEXT_PUBLIC_APP_URL: http://localhost:3000
 - name: Upload Playwright report
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: playwright-report
 path: frontend/playwright-report/
 retention-days: 7
