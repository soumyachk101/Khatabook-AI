# =============================================================================
# Khatabook-AI — CI/CD Pipeline
# =============================================================================
# Runs on every push/PR to main & develop.
# Jobs: lint → typecheck → build → unit-test → security-audit → e2e
# =============================================================================

name: CI

on:
 push:
 branches: [main, develop]
 pull_request:
 branches: [main, develop]

env:
 NODE_VERSION: "20"

jobs:
 # ── Lint & Format ───────────────────────────────────────────────────────────
 lint:
 name: Lint & Format
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Lint all workspaces
 run: npm run lint
 - name: Check formatting
 run: npm run format:check

 # ── TypeScript Typecheck ────────────────────────────────────────────────────
 typecheck:
 name: TypeScript Typecheck
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Typecheck all workspaces
 run: npm run typecheck

 # ── Build ───────────────────────────────────────────────────────────────────
 build:
 name: Build All Workspaces
 runs-on: ubuntu-latest
 needs: [lint, typecheck]
 timeout-minutes: 10
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Build shared library
 run: npm run build:shared
 - name: Build backend
 run: npm run build:backend
 - name: Build frontend
 run: npm run build:frontend

 # ── Unit Tests (Backend) ────────────────────────────────────────────────────
 test-unit:
 name: Backend Unit Tests
 runs-on: ubuntu-latest
 needs: build
 timeout-minutes: 10
 services:
 postgres:
 image: postgres:15-alpine
 env:
 POSTGRES_USER: postgres
 POSTGRES_PASSWORD: testpass
 POSTGRES_DB: khatabook_test
 options: >-
 --health-cmd pg_isready
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports: [5432:5432]
 redis:
 image: redis:7-alpine
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports: [6379:6379]
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Run Prisma migrations
 run: npx prisma migrate deploy
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 - name: Seed test database
 run: npm run db:seed -w backend
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 - name: Run unit tests
 run: npm run test:unit -w backend
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 JWT_SECRET: test-jwt-secret-for-ci
 OPENAI_API_KEY: sk-test-placeholder
 SUPABASE_URL: https://test-project.supabase.co
 SUPABASE_ANON_KEY: test-anon-key
 SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
 - name: Upload coverage report
 uses: actions/upload-artifact@v4
 with:
 name: coverage-report
 path: backend/coverage/
 retention-days: 7

 # ── Integration Tests ───────────────────────────────────────────────────────
 test-integration:
 name: Backend Integration Tests
 runs-on: ubuntu-latest
 needs: build
 timeout-minutes: 15
 services:
 postgres:
 image: postgres:15-alpine
 env:
 POSTGRES_USER: postgres
 POSTGRES_PASSWORD: testpass
 POSTGRES_DB: khatabook_test
 options: >-
 --health-cmd pg_isready
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports: [5432:5432]
 redis:
 image: redis:7-alpine
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 5s
 --health-timeout 5s
 --health-retries 5
 ports: [6379:6379]
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Start backend server
 run: npm run dev:backend &
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 JWT_SECRET: test-jwt-secret-for-ci
 PORT: 3004
 - name: Wait for server
 run: npx wait-on http://localhost:3004/health -t 30000
 - name: Run integration tests
 run: npm run test:integration -w backend
 env:
 DATABASE_URL: postgres://postgres:testpass@localhost:5432/khatabook_test
 REDIS_URL: redis://localhost:6379
 NODE_ENV: test
 JWT_SECRET: test-jwt-secret-for-ci
 BASE_URL: http://localhost:3004

 # ── Security Audit ──────────────────────────────────────────────────────────
 security-audit:
 name: Security Audit
 runs-on: ubuntu-latest
 timeout-minutes: 5
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Run npm audit
 run: npm audit --workspaces
 continue-on-error: true

 # ── E2E Tests (Frontend) ────────────────────────────────────────────────────
 test-e2e:
 name: Frontend E2E Tests
 runs-on: ubuntu-latest
 needs: build
 timeout-minutes: 15
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: npm
 - name: Install dependencies
 run: npm ci
 - name: Install Playwright browsers
 run: npx playwright install --with-deps chromium
 - name: Build frontend
 run: npm run build:frontend
 - name: Start frontend preview server
 run: npx next start -p 3000 &
 working-directory: frontend
 - name: Wait for frontend
 run: npx wait-on http://localhost:3000 -t 60000
 - name: Run Playwright tests
 run: npm run test:e2e -w frontend
 env:
 NEXT_PUBLIC_APP_URL: http://localhost:3000
 NEXT_PUBLIC_API_URL: http://localhost:3004
 - name: Upload Playwright report
 if: always()
 uses: actions/upload-artifact@v4
 with:
 name: playwright-report
 path: frontend/playwright-report/
 retention-days: 7

 # ── Docker Build Check ──────────────────────────────────────────────────────
 docker:
 name: Docker Build
 runs-on: ubuntu-latest
 needs: build
 timeout-minutes: 10
 steps:
 - uses: actions/checkout@v4
 - uses: docker/setup-buildx-action@v3
 - uses: docker/build-push-action@v5
 with:
 context: .
 file: backend/Dockerfile
 target: runner
 push: false
 tags: khatabook-ai-backend:ci-${{ github.sha }}
 cache-from: type=gha
 cache-to: type=gha,mode=max
