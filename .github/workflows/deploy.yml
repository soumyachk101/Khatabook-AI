# =============================================================================
# Khatabook AI — CD Pipeline
# =============================================================================
# Deploys to production when CI passes on push to main.
# - Frontend → Vercel
# - Backend → Railway
# =============================================================================

name: Deploy

on:
 push:
 branches: [main]
 workflow_run:
 workflows: ["CI"]
 types:
 - completed

# Prevent deployment if CI failed
jobs:
 deploy-frontend:
 name: Deploy Frontend to Vercel
 runs-on: ubuntu-latest
 environment: production
 if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Run lint and typecheck
 run: |
 npm run lint:frontend
 npm run typecheck:frontend
 - name: Deploy to Vercel Production
 uses: amondnet/vercel-action@v33
 with:
 vercel-token: ${{ secrets.VERCEL_TOKEN }}
 vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
 vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
 vercel-args: '--prod'
 working-directory: frontend
 env:
 NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
 NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
 NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
 NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
 NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
 NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
 NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
 NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
 NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
 NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
 NEXT_PUBLIC_OCR_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_OCR_SERVICE_URL }}
 NEXT_PUBLIC_ENVIRONMENT: production
 timeout-minutes: 10
 outputs:
 vercel-url: ${{ steps.deploy.outputs.url }}
 - name: Wait for Vercel deployment
 if: ${{ github.event_name != 'workflow_run' }}
 run: echo "Vercel deployment completed."

 deploy-backend:
 name: Deploy Backend to Railway
 runs-on: ubuntu-latest
 environment: production
 if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: 'npm'
 - name: Install dependencies
 run: npm run install:all
 - name: Run lint and typecheck
 run: |
 npm run lint:backend
 npm run typecheck:backend
 - name: Install Railway CLI
 run: npm install -g @railway/cli
 - name: Deploy to Railway
 run: railway up --service backend --detach
 env:
 RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
 timeout-minutes: 10
 - name: Wait for Railway deployment
 if: ${{ github.event_name != 'workflow_run' }}
 run: echo "Railway deployment completed."

 notify:
 name: Deployment Status Notification
 runs-on: ubuntu-latest
 needs: [deploy-frontend, deploy-backend]
 if: always()
 steps:
 - name: All deployments succeeded
 if: |
 needs.deploy-frontend.result == 'success' &&
 needs.deploy-backend.result == 'success'
 run: |
 echo "✓ Frontend deployed to Vercel"
 echo "✓ Backend deployed to Railway"
 echo "✓ Khatabook AI production deployment complete"
 - name: Deployment failed
 if: failure()
 run: |
 echo "✗ Deployment failed! Check the logs above."
 echo "Frontend status: ${{ needs.deploy-frontend.result }}"
 echo "Backend status: ${{ needs.deploy-backend.result }}"
 exit 1
