# =============================================================================
# Khatabook AI — Backend Docker Compose (Local Development)
# =============================================================================
# Starts PostgreSQL, Redis, backend API, and Adminer for local development.
# Usage: docker compose -f backend/docker-compose.yml up -d
# =============================================================================

services:
 # ── PostgreSQL Database ──────────────────────────────────────────────────
 db:
 image: postgres:15-alpine
 container_name: khatabook-db
 restart: unless-stopped
 ports:
 - "5432:5432"
 environment:
 POSTGRES_USER: postgres
 POSTGRES_PASSWORD: postgres
 POSTGRES_DB: khatabook
 POSTGRES_INITDB_ARGS: "-E UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
 volumes:
 - pgdata:/var/lib/postgresql/data
 - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U postgres -d khatabook"]
 interval: 5s
 timeout: 5s
 retries: 5
 networks:
 - khatabook
 labels:
 com.khatabook.service: "database"
 com.khatabook.managed: "false"

 # ── Redis Cache & Queue ──────────────────────────────────────────────────
 redis:
 image: redis:7-alpine
 container_name: khatabook-redis
 restart: unless-stopped
 ports:
 - "6379:6379"
 volumes:
 - redisdata:/data
 command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 5s
 timeout: 5s
 retries: 5
 networks:
 - khatabook
 labels:
 com.khatabook.service: "cache"

 # ── Backend API Service ──────────────────────────────────────────────────
 backend:
 build:
 context: ./backend
 dockerfile: Dockerfile
 container_name: khatabook-backend
 restart: unless-stopped
 ports:
 - "3001:3001"
 env_file:
 - ./backend/.env.example
 environment:
 # Override specific values for Docker networking
 DATABASE_URL: postgres://postgres:postgres@db:5432/khatabook
 REDIS_URL: redis://redis:6379
 UPSTASH_REDIS_REST_URL: redis://redis:6379
 UPSTASH_REDIS_REST_TOKEN: local-redis-token
 depends_on:
 db:
 condition: service_healthy
 redis:
 condition: service_healthy
 volumes:
 # Mount source for hot-reload in development
 - ./backend/src:/app/src:cached
 # Exclude node_modules from bind mount
 - /app/node_modules
 networks:
 - khatabook
 labels:
 com.khatabook.service: "backend"
 # Uncomment for development with hot-reload
 # command: npm run dev
 # profiles:
 # - dev

 # ── Adminer (DB Management UI) ──────────────────────────────────────────
 adminer:
 image: adminer:latest
 container_name: khatabook-adminer
 restart: unless-stopped
 ports:
 - "8080:8080"
 environment:
 ADMINER_DEFAULT_SERVER: db
 ADMINER_DESIGN: "nette"
 ADMINER_PLUGINS: "enum-types json-columns"
 depends_on:
 - db
 networks:
 - khatabook
 profiles:
 - dev

volumes:
 pgdata:
 driver: local
 redisdata:
 driver: local

networks:
 khatabook:
 driver: bridge
 name: khatabook-network
