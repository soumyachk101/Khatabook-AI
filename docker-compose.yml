# ═══════════════════════════════════════════════════════════════════════════════
# Khatabook-AI – docker-compose for local development & staging
# Usage:
# docker compose up -d # start all services
# docker compose logs -f app # tail app logs
# docker compose down -v # stop & wipe volumes
# ═══════════════════════════════════════════════════════════════════════════════
version: "3.9"

x-logging: &default-logging
 driver: json-file
 options:
 max-size: "10m"
 max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
 pgdata:
 redisdata:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
 khatabook-net:

# ═══════════════════════════════════════════════════════════════════════════════
# PostgreSQL 15
# ═══════════════════════════════════════════════════════════════════════════════
services:
 postgres:
 image: postgres:15-alpine
 container_name: khatabook-pg
 restart: unless-stopped
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-khatabook}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khatabook_dev}
 POSTGRES_DB: ${POSTGRES_DB:-khatabook}
 TZ: Asia/Kolkata
 volumes:
 - pgdata:/var/lib/postgresql/data
 ports:
 - "${POSTGRES_PORT:-5432}:5432"
 networks:
 - khatabook-net
 logging: *default-logging
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khatabook} -d ${POSTGRES_DB:-khatabook}"]
 interval: 10s
 timeout: 5s
 retries: 5

# ═══════════════════════════════════════════════════════════════════════════════
# Redis 7 (caching + BullMQ broker)
# ═══════════════════════════════════════════════════════════════════════════════
 redis:
 image: redis:7-alpine
 container_name: khatabook-redis
 restart: unless-stopped
 command: >
 redis-server
 --maxmemory 256mb
 --maxmemory-policy allkeys-lru
 --save 60 1
 volumes:
 - redisdata:/data
 ports:
 - "${REDIS_PORT:-6379}:6379"
 networks:
 - khatabook-net
 logging: *default-logging
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 10s
 timeout: 5s
 retries: 5

# ═══════════════════════════════════════════════════════════════════════════════
# Fastify Backend API
# ═══════════════════════════════════════════════════════════════════════════════
 app:
 build:
 context: .
 dockerfile: Dockerfile
 target: builder # reuse builder stage for dev to avoid full rebuild
 container_name: khatabook-app
 restart: unless-stopped
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 environment:
 NODE_ENV: ${NODE_ENV:-development}
 PORT: 3004
 DATABASE_URL: postgresql://${POSTGRES_USER:-khatabook}:${POSTGRES_PASSWORD:-khatabook_dev}@postgres:5432/${POSTGRES_DB:-khatabook}?schema=public
 REDIS_URL: redis://redis:6379
 OPENAI_API_KEY: ${OPENAI_API_KEY}
 RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
 RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
 TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
 TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
 TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
 SUPABASE_URL: ${SUPABASE_URL}
 SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
 SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
 JWT_SECRET: ${JWT_SECRET}
 WEBHOOK_SECRET: ${WEBHOOK_SECRET}
 CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
 ports:
 - "${APP_PORT:-3004}:3004"
 volumes:
 - ./src:/app/src # hot-reload in development
 - ./logs:/app/logs
 networks:
 - khatabook-net
 logging: *default-logging
 # Override in development for nodemon-style reload:
 # command: npm run dev

# ═══════════════════════════════════════════════════════════════════════════════
# Background Worker (BullMQ jobs – OCR processing, invoice reminders, etc.)
# ═══════════════════════════════════════════════════════════════════════════════
 worker:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: khatabook-worker
 restart: unless-stopped
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 app:
 condition: service_started
 environment:
 NODE_ENV: ${NODE_ENV:-production}
 DATABASE_URL: postgresql://${POSTGRES_USER:-khatabook}:${POSTGRES_PASSWORD:-khatabook_dev}@postgres:5432/${POSTGRES_DB:-khatabook}?schema=public
 REDIS_URL: redis://redis:6379
 OPENAI_API_KEY: ${OPENAI_API_KEY}
 TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
 TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
 TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
 SUPABASE_URL: ${SUPABASE_URL}
 SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
 JWT_SECRET: ${JWT_SECRET}
 volumes:
 - ./logs:/app/logs
 networks:
 - khatabook-net
 logging: *default-logging
 command: ["node", "--max-old-space-size=512", "dist/worker.js"]

